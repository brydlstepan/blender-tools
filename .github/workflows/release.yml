name: Release

# Runs when a version tag like v0.6.0 is pushed. The tag must match `version`
# in blender_manifest.toml. Builds the extension zip, publishes it as a GitHub
# Release, and redeploys the GitHub Page (install page + extensions repository).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

env:
  BLENDER_VERSION: "5.2.3"
  BLENDER_SERIES: "5.2"

permissions:
  contents: write # create the GitHub Release
  pages: write # deploy the Page
  id-token: write # needed by deploy-pages

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the manifest version
        run: |
          manifest=$(python3 -c "import tomllib; print(tomllib.load(open('blender_manifest.toml','rb'))['version'])")
          if [ "v$manifest" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest" >&2
            exit 1
          fi

      - name: Unit tests
        run: python3 -m unittest discover tests

      - name: Install Blender libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxi6 libxrender1 libxkbcommon0 libsm6 libgl1 libxxf86vm1 libxfixes3

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -fsSL "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            | tar -xJ -C ~/blender --strip-components=1

      - name: Build extension and repository
        run: |
          mkdir -p dist
          ~/blender/blender --command extension build --source-dir . --output-dir dist
          ~/blender/blender --command extension server-generate --repo-dir dist --html --html-template site/template.html
          ls -l dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
