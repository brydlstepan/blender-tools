name: Release

# Runs when a version tag like v0.6.0 is pushed. The tag must match `version`
# in blender_manifest.toml. Builds the extension zip, publishes it as a GitHub
# Release, and redeploys the GitHub Page (install page + extensions repository).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

env:
  BLENDER_VERSION: "5.2.3"
  BLENDER_SERIES: "5.2"

permissions:
  contents: write # create the GitHub Release
  pages: write # deploy the Page
  id-token: write # needed by deploy-pages

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the manifest version
        run: |
          manifest=$(python3 -c "import tomllib; print(tomllib.load(open('blender_manifest.toml','rb'))['version'])")
          if [ "v$manifest" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest" >&2
            exit 1
          fi

      - name: Unit tests
        run: python3 -m unittest discover tests

      - uses: ./.github/actions/setup-blender
        with:
          version: ${{ env.BLENDER_VERSION }}
          series: ${{ env.BLENDER_SERIES }}

      - name: Build extension and repository
        run: |
          mkdir -p dist
          ~/blender/blender --command extension build --source-dir . --output-dir dist
          ~/blender/blender --command extension server-generate --repo-dir dist --html --html-template site/template.html
          # Point the drag-and-drop button at the built zip (same link format Blender generates).
          python3 - <<'PY'
          import glob, os, tomllib
          zip_name = os.path.basename(glob.glob("dist/*.zip")[0])
          minimum = tomllib.load(open("blender_manifest.toml", "rb"))["blender_version_min"]
          url = f"./{zip_name}?repository=.%2Findex.json&blender_version_min={minimum}"
          page = open("dist/index.html", encoding="utf-8").read()
          assert "__ZIP_URL__" in page and "__ZIP_FILE__" in page
          page = page.replace("__ZIP_URL__", url.replace("&", "&amp;")).replace("__ZIP_FILE__", f"./{zip_name}")
          open("dist/index.html", "w", encoding="utf-8").write(page)
          PY
          ls -l dist
          # The zip must hold only the add-on (about 30 KB). Fail if something big got packed.
          for z in dist/*.zip; do
            size=$(stat -c %s "$z")
            if [ "$size" -gt 1048576 ]; then
              echo "$z is $size bytes, expected well under 1 MB" >&2
              unzip -l "$z" | sort -k1 -n -r | head >&2
              exit 1
            fi
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
